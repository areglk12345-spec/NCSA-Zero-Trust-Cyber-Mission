document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"f5236a6e-286a-4206-8b6f-e0c3251badff\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Noto Sans Thai';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"c018477d-c422-4fd3-88c2-36673ece7104\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#eef0f5;font-family:'Noto Sans Thai','Chakra Petch',system-ui,sans-serif}\n*{box-sizing:border-box}\na{color:#e8f4ff}a:hover{color:#e2231c}\n@keyframes ncsa-spin{to{transform:rotate(360deg)}}\n@keyframes ncsa-alert-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,.5)}50%{box-shadow:0 0 0 14px rgba(255,77,77,0)}}\n@keyframes ncsa-alert-fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:transparent\">\n  <div style=\"position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#05070f,#0d1a33);padding:14px 28px;display:flex;align-items:center;gap:18px;overflow-x:auto;border-bottom:1px solid rgba(53,208,255,.25);box-shadow:0 0 20px -4px rgba(53,208,255,.3)\">\n    <div style=\"display:flex;align-items:center;gap:8px;flex:none\">\n      <div style=\"width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#1c2f7a,#e2231c);display:flex;align-items:center;justify-content:center;font:700 12px 'Chakra Petch';color:#fff\">N<\u002Fdiv>\n      <div style=\"font:700 14px 'Chakra Petch';color:#fff;white-space:nowrap\">NCSA · Admin Console (Website)<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;flex:none\">\n      <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ tab.onClick }}\" style=\"{{ tab.style }}\">{{ tab.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:36px 28px 80px;display:flex;flex-direction:column;align-items:center;gap:16px\">\n\n    <!-- HOME -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width:100%;max-width:900px;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#0a0e1a,#12205c 55%,#1c2f7a);box-shadow:0 30px 80px -30px rgba(0,0,0,.5);color:#fff\">\n        <div style=\"padding:90px 40px 100px;text-align:center\">\n          <div style=\"font:700 12px 'Chakra Petch';letter-spacing:.16em;opacity:.6\">NCSA PRESENTS<\u002Fdiv>\n          <div style=\"font:700 46px 'Chakra Petch';margin-top:16px;letter-spacing:.02em\">ZERO TRUST<br>CYBER MISSION<\u002Fdiv>\n          <div style=\"font:500 14px 'Noto Sans Thai';opacity:.65;margin-top:16px;max-width:480px;margin-left:auto;margin-right:auto;line-height:1.7\">เกมจำลองสถานการณ์ด้านความมั่นคงปลอดภัยไซเบอร์ วิเคราะห์เหตุการณ์จริงและสั่งใช้มาตรการ Zero Trust ให้ทันเวลา<\u002Fdiv>\n          <div style=\"display:flex;gap:14px;justify-content:center;margin-top:44px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ goHowToPlay }}\" style=\"padding:16px 28px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font:700 14px 'Chakra Petch';letter-spacing:.04em;cursor:pointer\">วิธีการเล่น<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goPlay }}\" style=\"padding:16px 32px;border:none;border-radius:12px;background:#e2231c;color:#fff;font:700 14px 'Chakra Petch';letter-spacing:.04em;cursor:pointer\">เล่นเกม →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- HOW TO PLAY -->\n    <sc-if value=\"{{ isHowToPlay }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:100%;max-width:900px;border-radius:18px;background:linear-gradient(160deg,rgba(20,28,48,.9),rgba(10,14,26,.95));border:1px solid rgba(53,208,255,.25);box-shadow:0 0 40px -10px rgba(53,208,255,.15),0 20px 50px -30px rgba(0,0,0,.6);backdrop-filter:blur(6px);overflow:hidden\">\n        <div style=\"padding:32px 40px 24px;border-bottom:1px solid #eceef4\">\n          <div style=\"font:700 22px 'Chakra Petch';color:#e8f4ff\">How to Play<\u002Fdiv>\n          <div style=\"font:500 12.5px 'Noto Sans Thai';color:#8fa3c4;margin-top:6px\">ภาพรวมขั้นตอนของแต่ละ Mission ที่ผู้เล่นจะพบตลอดเกม<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:32px 40px\">\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <sc-for list=\"{{ howToSteps }}\" as=\"st\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;gap:14px;align-items:flex-start\">\n                <div style=\"width:30px;height:30px;border-radius:8px;background:rgba(53,208,255,.12);color:#e8f4ff;display:flex;align-items:center;justify-content:center;font:700 13px 'Chakra Petch';flex:none\">{{ st.n }}<\u002Fdiv>\n                <div>\n                  <div style=\"font:700 13px 'Chakra Petch';color:#e8f4ff\">{{ st.title }}<\u002Fdiv>\n                  <div style=\"font:500 12.5px 'Noto Sans Thai';color:#8fa3c4;margin-top:2px;line-height:1.5\">{{ st.desc }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;margin-top:32px\">\n            <button sc-camel-on-click=\"{{ goHome }}\" style=\"flex:1;padding:15px;border:1px solid rgba(53,208,255,.3);border-radius:12px;background:rgba(255,255,255,.05);color:#e8f4ff;font:700 13.5px 'Chakra Petch';cursor:pointer\">← กลับหน้าแรก<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goPlay }}\" style=\"flex:2;padding:15px;border:none;border-radius:12px;background:#e2231c;color:#fff;font:700 14px 'Chakra Petch';letter-spacing:.04em;cursor:pointer\">เล่นเกม →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- MISSION SELECT -->\n    <sc-if value=\"{{ isMissionSelect }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width:100%;max-width:1280px;border-radius:18px;background:linear-gradient(160deg,rgba(20,28,48,.9),rgba(10,14,26,.95));border:1px solid rgba(53,208,255,.25);box-shadow:0 0 40px -10px rgba(53,208,255,.15),0 20px 50px -30px rgba(0,0,0,.6);backdrop-filter:blur(6px);overflow:hidden\">\n        <div style=\"padding:22px 28px;border-bottom:1px solid #eceef4;display:flex;justify-content:space-between;align-items:center\">\n          <div style=\"font:700 19px 'Chakra Petch';color:#e8f4ff\">เลือก Mission (เลือกได้มากกว่า 1)<\u002Fdiv>\n          <div style=\"font:600 12px 'Chakra Petch';color:#7a91b3\">20 Missions ทั้งหมด · เลือกแล้ว {{ selectedCount }} รายการ<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 28px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #eceef4\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ catFilters }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ interFilters }}\" as=\"i\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ i.onClick }}\" style=\"{{ i.style }}\">{{ i.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 28px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px\">\n          <sc-for list=\"{{ missionsView }}\" as=\"m\" hint-placeholder-count=\"20\">\n            <div style=\"{{ m.cardStyle }}\">\n              <div style=\"height:88px;background:{{ m.thumbBg }};display:flex;align-items:center;justify-content:center;font:700 12px 'Chakra Petch';color:rgba(255,255,255,.85);letter-spacing:.05em\">{{ m.category }}<\u002Fdiv>\n              <div style=\"padding:14px;display:flex;flex-direction:column;gap:8px;flex:1\">\n                <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n                  <div style=\"font:700 14px 'Chakra Petch';color:#e8f4ff\">{{ m.name }}<\u002Fdiv>\n                  <input type=\"checkbox\" checked=\"{{ m.checked }}\" sc-camel-on-change=\"{{ m.onCheck }}\" style=\"width:16px;height:16px;margin-top:2px\">\n                <\u002Fdiv>\n                <div style=\"font:500 11.5px 'Noto Sans Thai';color:#8fa3c4;line-height:1.5\">{{ m.scenario }}<\u002Fdiv>\n                <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                  <div style=\"font:600 9.5px 'Chakra Petch';padding:3px 7px;border-radius:5px;background:rgba(53,208,255,.12);color:#a9c2e0\">{{ m.interaction }}<\u002Fdiv>\n                  <div style=\"font:600 9.5px 'Chakra Petch';padding:3px 7px;border-radius:5px;background:rgba(255,77,77,.15);color:#ff8a80\">{{ m.principle }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font:600 11px 'Chakra Petch';color:#7a91b3\">{{ m.difficultyDots }} · แนะนำ {{ m.recTime }}s · {{ m.actionCount }} Actions<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:22px 28px;border-top:1px solid #eceef4;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font:700 13px 'Chakra Petch';color:#e8f4ff\">ตั้งค่าเวลาต่อ Scenario<\u002Fdiv>\n          <label style=\"display:flex;align-items:center;gap:8px;font:600 12px 'Chakra Petch';color:#a9c2e0\">\n            <input type=\"checkbox\" checked=\"{{ useRecommended }}\" sc-camel-on-change=\"{{ toggleRecommended }}\">\n            ใช้เวลาที่ระบบแนะนำต่อประเภท Scenario\n          <\u002Flabel>\n          <sc-if value=\"{{ showCustomTime }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:14px\">\n              <input type=\"range\" min=\"5\" max=\"300\" value=\"{{ customTime }}\" sc-camel-on-change=\"{{ onTimeChange }}\" style=\"flex:1\">\n              <div style=\"font:700 13px 'Chakra Petch';color:#e8f4ff;width:70px\">{{ customTime }} วินาที<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"padding:20px 28px 0;border-top:1px solid #eceef4;padding-top:20px\">\n          <div style=\"border:1px solid rgba(53,208,255,.15);border-radius:14px;padding:18px 20px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:700 13px 'Chakra Petch';color:#e8f4ff\">Final Attack — ระดับความยาก (ต่อท้ายทุกครั้งหลังจบ Mission ที่เลือก)<\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ difficultyChips }}\" as=\"dc\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ dc.onClick }}\" style=\"{{ dc.style }}\">{{ dc.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ missionSequenceLabel }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:600 11.5px 'Chakra Petch';color:#a9c2e0;background:#fff;border:1px solid rgba(53,208,255,.15);border-radius:8px;padding:10px 12px;line-height:1.6\">{{ missionSequenceLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 28px 28px\">\n          <button sc-camel-on-click=\"{{ goJoiningRoom }}\" disabled=\"{{ noMissionSelected }}\" style=\"{{ missionNextStyle }}\">ถัดไป: เข้าห้อง Joining Room →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- JOINING ROOM (HOST) -->\n    <sc-if value=\"{{ isJoiningRoom }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width:100%;max-width:900px;border-radius:18px;background:linear-gradient(160deg,rgba(20,28,48,.9),rgba(10,14,26,.95));border:1px solid rgba(53,208,255,.25);box-shadow:0 0 40px -10px rgba(53,208,255,.15),0 20px 50px -30px rgba(0,0,0,.6);backdrop-filter:blur(6px);overflow:hidden\">\n        <div style=\"padding:32px 40px;text-align:center;background:linear-gradient(180deg,#12205c,#1c2f7a);color:#fff\">\n          <div style=\"font:600 12px 'Chakra Petch';letter-spacing:.1em;opacity:.7\">GAME PIN<\u002Fdiv>\n          <div style=\"font:700 46px 'Chakra Petch';letter-spacing:.06em;margin-top:6px\">482 913<\u002Fdiv>\n          <div style=\"width:120px;height:120px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#e8f4ff;font:700 11px 'Chakra Petch';margin:16px auto 0\">QR CODE<\u002Fdiv>\n          <div style=\"font:500 12px 'Noto Sans Thai';opacity:.6;margin-top:10px\">ผู้เล่นสแกนหรือกรอก Game PIN ที่เว็บไซต์เพื่อเข้าร่วม<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 40px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px\">\n            <div style=\"font:700 14px 'Chakra Petch';color:#e8f4ff\">ห้องรอผู้เล่น<\u002Fdiv>\n            <div style=\"font:600 12px 'Chakra Petch';color:#7a91b3\">{{ joinedCount }} คนเข้าร่วม · {{ selectedCount }} Mission<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\">\n            <sc-for list=\"{{ joinedPlayersView }}\" as=\"p\" hint-placeholder-count=\"0\">\n              <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(53,208,255,.15);border-radius:10px;padding:10px 12px\">\n                <div style=\"font:600 12px 'Chakra Petch';color:#e8f4ff\">{{ p.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ startLoading }}\" style=\"width:100%;margin-top:24px;padding:16px;border:none;border-radius:12px;background:#e2231c;color:#fff;font:700 15px 'Chakra Petch';letter-spacing:.04em;cursor:pointer\">เริ่มเกม<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- LOADING -->\n    <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:100%;max-width:500px;border-radius:18px;background:#0a0e1a;color:#fff;padding:60px 40px;text-align:center\">\n        <div style=\"width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#35d0ff;margin:0 auto;animation:ncsa-spin 1s linear infinite\"><\u002Fdiv>\n        <div style=\"font:700 18px 'Chakra Petch';margin-top:24px\">กำลังเตรียมภารกิจ...<\u002Fdiv>\n        <div style=\"font:600 13px 'Chakra Petch';color:#35d0ff;margin-top:8px\">{{ loadingSeconds }}s<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- QUESTION SCENARIO (regular round) -->\n    <sc-if value=\"{{ isQuestionRound }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:100%;max-width:700px;border-radius:18px;background:#0a0e1a;color:#fff;overflow:hidden;box-shadow:0 20px 60px -30px rgba(0,0,0,.6)\">\n        <div style=\"padding:16px 32px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center\">\n          <div style=\"font:600 11px 'Chakra Petch';letter-spacing:.06em;color:rgba(255,255,255,.5)\">{{ roundProgressLabel }}<\u002Fdiv>\n          <div style=\"font:700 11px 'Chakra Petch';color:#ff4d4d\">HIGH RISK<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:36px 32px 24px;display:flex;flex-direction:column;gap:8px;align-items:center;background:radial-gradient(circle at 50% 0%,rgba(255,77,77,.18),transparent 70%)\">\n          <div style=\"width:72px;height:72px;border-radius:50%;border:3px solid #ff4d4d;display:flex;align-items:center;justify-content:center;font:700 30px 'Chakra Petch';color:#ff4d4d;animation:ncsa-alert-pulse 1.6s ease-in-out infinite\">!<\u002Fdiv>\n          <div style=\"font:700 20px 'Chakra Petch';text-align:center;margin-top:8px;animation:ncsa-alert-fadein .6s ease-out\">MISSION ALERT<\u002Fdiv>\n          <div style=\"font:700 15px 'Chakra Petch';text-align:center;margin-top:4px\">{{ currentMission.name }}<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;justify-content:center;margin-top:8px\">\n            <div style=\"font:600 10px 'Chakra Petch';padding:4px 10px;border-radius:6px;background:rgba(53,208,255,.15);color:#35d0ff\">{{ currentMission.interaction }}<\u002Fdiv>\n            <div style=\"font:600 10px 'Chakra Petch';padding:4px 10px;border-radius:6px;background:rgba(226,35,28,.15);color:#ff8a80\">{{ currentMission.principle }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 32px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:700 12px 'Chakra Petch';letter-spacing:.06em;color:rgba(255,255,255,.55)\">SITUATION BRIEFING<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px\">\n            <div style=\"font:500 13px 'Noto Sans Thai';color:rgba(255,255,255,.85);line-height:1.7\">{{ currentMission.scenario }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:4px\">\n            <button sc-camel-on-click=\"{{ toggleEvidenceHint }}\" style=\"padding:7px 12px;border:1px solid rgba(53,208,255,.4);border-radius:8px;background:rgba(53,208,255,.08);color:#35d0ff;font:700 11px 'Chakra Petch';cursor:pointer\">{{ evidenceHintLabel }}<\u002Fbutton>\n            <div style=\"font:700 12px 'Chakra Petch';color:#35d0ff\">{{ currentMission.recTime }}s ต่อคำตอบ<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showEvidenceHint }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px\">\n              <sc-for list=\"{{ evidenceItems }}\" as=\"e\" hint-placeholder-count=\"8\">\n                <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px\">\n                  <div style=\"width:22px;height:22px;border-radius:6px;background:rgba(53,208,255,.15);color:#35d0ff;display:flex;align-items:center;justify-content:center;font:700 10px 'Chakra Petch';margin-bottom:6px\">{{ e.k }}<\u002Fdiv>\n                  <div style=\"font:600 9px 'Chakra Petch';letter-spacing:.04em;color:rgba(255,255,255,.5)\">{{ e.label }}<\u002Fdiv>\n                  <div style=\"font:600 11.5px 'Noto Sans Thai';margin-top:2px;line-height:1.4\">{{ e.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"padding:8px 32px 32px\">\n          <button sc-camel-on-click=\"{{ showAnswer }}\" style=\"width:100%;padding:16px;border:none;border-radius:12px;background:#e2231c;color:#fff;font:700 15px 'Chakra Petch';letter-spacing:.04em;cursor:pointer\">ผู้เล่นตอบครบ / หมดเวลา — ดูคำตอบ →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ANSWER REVEAL -->\n    <sc-if value=\"{{ isAnswerReveal }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:100%;max-width:900px;border-radius:18px;background:linear-gradient(160deg,rgba(20,28,48,.9),rgba(10,14,26,.95));border:1px solid rgba(53,208,255,.25);box-shadow:0 0 40px -10px rgba(53,208,255,.15),0 20px 50px -30px rgba(0,0,0,.6);backdrop-filter:blur(6px);overflow:hidden\">\n        <div style=\"padding:20px 32px;border-bottom:1px n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 32px 28px\">\n          <button sc-camel-on-click=\"{{ goLeaderboardFromAnswer }}\" style=\"width:100%;padding:15px;border:none;border-radius:12px;background:#12205c;color:#fff;font:700 14px 'Chakra Petch';letter-spacing:.04em;cursor:pointer\">ไปที่ Leaderboard →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- LIVE CONTROL / LEADERBOARD -->\n    <sc-if value=\"{{ isLiveControl }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width:100%;max-width:1280px;border-radius:18px;background:linear-gradient(160deg,rgba(20,28,48,.9),rgba(10,14,26,.95));border:1px solid rgba(53,208,255,.25);box-shadow:0 0 40px -10px rgba(53,208,255,.15),0 20px 50px -30px rgba(0,0,0,.6);backdrop-filter:blur(6px);overflow:hidden\">\n        <div style=\"padding:22px 28px;border-bottom:1px solid #eceef4;display:flex;justify-content:space-between;align-items:center\">\n          <div>\n            <div style=\"font:700 19px 'Chakra Petch';color:#e8f4ff\">Leaderboard — PIN 482 913<\u002Fdiv>\n            <div style=\"font:600 12px 'Chakra Petch';color:#7a91b3;margin-top:4px\">{{ roundProgressLabel }} · 24 Players<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px\">\n            <label style=\"display:flex;align-items:center;gap:8px;font:600 12px 'Chakra Petch';color:#a9c2e0\">\n              <input type=\"checkbox\" checked=\"{{ revealRecommended }}\" sc-camel-on-change=\"{{ toggleReveal }}\">\n              เปิดเผย Recommended Action ให้ผู้เล่นเห็น\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ goWinning }}\" style=\"padding:10px 16px;border:none;border-radius:8px;background:#e2231c;color:#fff;font:700 12px 'Chakra Petch';cursor:pointer\">{{ nextRoundLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24p ion }}<\u002Fdiv>\n                <sc-for list=\"{{ detailLayerView.optionsView }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">{{ opt.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ detailLayerView.taskDone }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:4px;padding:10px 12px;border-radius:8px;background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);font:500 12px 'Noto Sans Thai';color:#c8ffe1;line-height:1.6\">{{ detailLayerView.reason }}<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ detailLayerView.ackNext }}\" style=\"margin-top:4px;padding:10px 12px;border:none;border-radius:8px;background:#2ecc71;color:#062a1a;font:700 12px 'Chakra Petch';cursor:pointer\">ถัดไป: โจทย์ที่ 2 →<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ detailLayerView.stepQ2 }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:18px;display:flex;flex-direction:column;gap:10px\">\n                <div style=\"font:700 12px 'Chakra Petch';color:#ff8a3d\">โจทย์ที่ 2 / 2 — การตั้งค่า<\u002Fdiv>\n                <div style=\"font:600 12.5px 'Noto Sans Thai';color:rgba(255,255,255,.85)\">{{ detailLayerView.setupQuestion }}<\u002Fdiv>\n                <sc-for list=\"{{ detailLayerView.setupOptionsView }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">{{ opt.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ detailLayerView.setupTaskDone }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:4px;padding:10px 12px;border-radius:8px;background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);font:500 12px 'Noto Sans Thai';color:#c8ffe1;line-height:1.6\">{{ detailLayerView.setupReason }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ detailLayerView.showConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:18px;padding:12px;border-radius:10px;background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);font:700 12px 'Chakra Petch';color:#2ecc71\">✓ ผ่านทั้ง 2 โจทย์แล้ว — พร้อมนำมาตรการนี้ไปใช้<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;gap:10px;margin-top:24px\">\n              <button sc-camel-on-click=\"{{ closeLayerDetail }}\" style=\"flex:1;padding:12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:transparent;color:#fff;font:700 12.5px 'Chakra Petch';cursor:pointer\">ปิด<\u002Fbutton>\n              <sc-if value=\"{{ detailLayerView.showConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ detailLayerView.onConfirm }}\" style=\"flex:1;padding:12px;border:none;border-radius:10px;background:#e2231c;color:#fff;font:700 12.5px 'Chakra Petch';cursor:pointer\">{{ detailLayerView.confirmLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    activeScreen: 'home',\n    catFilter: 'all',\n    interFilter: 'all',\n    selectedMissions: [],\n    useRecommended: true,\n    customTime: 45,\n    finalAttackDifficulty: 'medium',\n    loadingSeconds: 5,\n    currentMissionIndex: 0,\n    revealRecommended: false,\n    showEvidenceHint: false,\n    deployedLayers: [],\n    joinedCount: 0,\n    openLayerMenuId: null,\n    detailLayerId: null,\n    completedTasks: [],\n    completedSetupTasks: [],\n    ackedQ1: [],\n    taskWrongId: null,\n    setupWrongId: null\n  };\n\n  difficultyLevels = [\n    {id:'easy', label:'ง่าย'}, {id:'medium', label:'กลาง'}, {id:'hard', label:'ยาก'}\n  ];\n\n  screensData = [\n    {id:'home', label:'Home'},\n    {id:'missionSelect', label:'Mission Select'}\n  ];\n\n  howToSteps = [\n    {n:1, title:'Mission Alert', desc:'ระบบแจ้งเตือนเหตุการณ์ด้านความมั่นคงปลอดภัยไซเบอร์ที่ตรวจพบ'},\n    {n:2, title:'Situation Briefing', desc:'สรุปสถานการณ์แบบกระชับ: เกิดอะไรขึ้น กับใคร เมื่อไหร่ และผลกระทบ'},\n    {n:3, title:'Evidence Panel', desc:'ตรวจสอบหลักฐาน เช่น อุปกรณ์ ตำแหน่ง สถานะ MFA ก่อนตัดสินใจ'},\n    {n:4, title:'Security Decision', desc:'เลือก Security Action ที่เหมาะสมที่สุดเพื่อรับมือสถานการณ์'},\n    {n:5, title:'Mission Outcome', desc:'ดูผลลัพธ์ของการตัดสินใจที่มีต่อระบบและ Zero Trust Shield'},\n    {n:6, title:'Security Debrief', desc:'สรุปเหตุผล มาตรการที่แนะนำ หลักการ Zero Trust และคะแนนที่ได้รับ'}\n  ];\n\n  missions = [\n    {id:1, name:'Unknown Device', category:'Device', interaction:'เลือกมาตรการ', principle:'Verify Explicitly', difficulty:2, actionCount:4, thumbBg:'#1c2f7a',\n      scenario:'ระบบตรวจพบว่าพนักงานคนหนึ่งเข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่านที่ถูกต้องทุกประการ แต่การ Login ครั้งนี้มาจากอุปกรณ์ที่ไม่เคยลงทะเบียนหรือใช้งานมาก่อนในระบบขององค์กร ทำให้ไม่สามารถยืนยันได้ว่าอุปกรณ์นี้ปลอดภัยหรือถูกดักจับ Session ไปใช้งานโดยผู้ไม่หวังดี'},\n    {id:2, name:'Suspicious Login', category:'Identity', interaction:'เลือกมาตรการ', principle:'Assume Breach', difficulty:3, actionCount:4, thumbBg:'#12205c',\n      scenario:'บัญชีผู้ดูแลระบบ (Admin) มีความพยายาม Login เข้าใช้งานจากตำแหน่งทางภูมิศาสตร์ที่ไม่คุ้นเคยหลายครั้งภายในเวลาไม่ถึง 5 นาที ซึ่งเป็นพฤติกรรมที่ผิดปกติอย่างชัดเจนเมื่อเทียบกับรูปแบบการใช้งานปกติของบัญชีนี้ และอาจบ่งชี้ว่า Credential ถูกขโมยไปแล้ว'},\n    {id:3, name:'Vendor Access', category:'Access', interaction:'เลือกหลายมาตรการ', principle:'Least Privilege', difficulty:3, actionCount:6, thumbBg:'#2a3a7a',\n      scenario:'บริษัท Vendor ภายนอกติดต่อขอสิทธิ์เข้าถึงระบบภายในองค์กรเพื่อดำเนินการซ่อมบำรุงระบบชั่วคราวตามสัญญา แต่คำขอที่ส่งมาระบุสิทธิ์การเข้าถึงในระดับที่กว้างกว่าที่งานซ่อมบำรุงจำเป็นต้องใช้จริง'},\n    {id:4, name:'MFA Bombing', category:'Incident Response', interaction:'เรียงลำดับ', principle:'Continuous Monitoring', difficulty:4, actionCount:5, thumbBg:'#7a1c2f',\n      scenario:'พนักงานรายหนึ่งได้รับการแจ้งเตือนขอยืนยันตัวตนผ่าน MFA (Multi-Factor Authentication) จำนวนมากผิดปกติในช่วงเวลาไล่เลี่ยกัน ทั้งที่ตนเองไม่ได้พยายาม Login ซึ่งเป็นเทคนิคที่ผู้โจมตีใช้เพื่อรบกวนจนผู้ใช้กดยืนยันโดยไม่ตั้งใจ (MFA Fatigue Attack)'},\n    {id:5, name:'Impossible Travel', category:'Monitoring', interaction:'วิเคราะห์หลักฐาน', principle:'Verify Explicitly', difficulty:3, actionCount:4, thumbBg:'#1c5a7a',\n      scenario:'บัญชีผู้ใช้เดียวกันมีการ Login เข้าใช้งานจากสองประเทศที่อยู่ห่างกันมากในช่วงเวลาห่างกันเพียงไม่กี่นาที ซึ่งเป็นไปไม่ได้ในทางกายภาพที่บุคคลเดียวจะเดินทางไปถึงได้ทันเวลา จึงบ่งชี้ว่าอาจมีผู้อื่นถือ Credential นี้อยู่ด้วย'},\n    {id:6, name:'Lost MFA Device', category:'Identity', interaction:'เลือกมาตรการ', principle:'Assume Breach', difficulty:2, actionCount:4, thumbBg:'#4a1c7a',\n      scenario:'พนักงานแจ้งว่าโทรศัพท์มือถือที่ใช้เป็นอุปกรณ์ยืนยันตัวตนสองชั้น (MFA) สูญหาย ทำให้อุปกรณ์ดังกล่าวอาจตกไปอยู่ในมือของผู้ไม่หวังดีที่สามารถใช้ยืนยันตัวตนแทนพนักงานคนนั้นและเข้าถึงระบบต่าง ๆ ที่ผูกไว้กับอุปกรณ์นี้ได้'},\n    {id:7, name:'Credential Stolen', category:'Identity', interaction:'เลือกมาตรการ', principle:'Assume Breach', difficulty:3, actionCount:4, thumbBg:'#12205c',\n      scenario:'ทีม Security ตรวจพบว่า Username และ Password ของพนักงานคนหนึ่งถูกนำไปเผยแพร่และขายในตลาดมืดบนอินเทอร์เน็ต (Dark Web) ซึ่งหมายความว่า Credential นี้ไม่ปลอดภัยอีกต่อไปแม้เจ้าของบัญชีจะยังไม่รู้ตัวว่าถูกขโมย'},\n    {id:8, name:'Remote Working', category:'Access', interaction:'เลือกหลายมาตรการ', principle:'Least Privilege', difficulty:2, actionCount:6, thumbBg:'#2a3a7a',\n      scenario:'พนักงานขอเข้าถึงระบบและข้อม const isAnswerReveal = s.activeScreen==='answerReveal';\n    const isHowToPlay = s.activeScreen==='howToPlay';\n\n    const shieldPct = Math.min(30 + s.deployedLayers.length*10, 100);\n    const CX = 230, CY = 230, RADIUS = 168;\n    const angleStep = 360 / this.defenseLayers.length;\n    const nodePositions = this.defenseLayers.map((l, idx) => {\n      const angle = (idx * angleStep - 90) * Math.PI / 180;\n      return { x: CX + RADIUS * Math.cos(angle), y: CY + RADIUS * Math.sin(angle) };\n    });\n    const defenseLayersView = this.defenseLayers.map((l, idx) => {\n      const on = s.deployedLayers.includes(l.id);\n      const pos = nodePositions[idx];\n      const menuOpen = s.openLayerMenuId === l.id;\n      return {\n        ...l, onClick: () => this.openLayerMenu(l.id),\n        nodeStyle: `position:absolute;left:${pos.x}px;top:${pos.y}px;transform:translate(-50%,-50%);width:104px;padding:10px 8px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;background:${on?'linear-gradient(160deg,rgba(53,208,255,.22),rgba(10,20,32,.92))':'rgba(20,24,34,.85)'};border:1px solid ${menuOpen?'#fff':(on?'#35d0ff':'rgba(255,255,255,.15)')};box-shadow:${on?'0 0 16px rgba(53,208,255,.45)':'0 2px 6px -2px rgba(0,0,0,.5)'};transition:box-shadow .25s,background .25s;z-index:${menuOpen?4:2}`,\n        iconStyle: `width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:${on?'#eafcff':'rgba(255,255,255,.6)'};background:radial-gradient(circle at 30% 28%,${on?'#7fe6ff':'rgba(255,255,255,.35)'},${on?'#0f7fb0':'rgba(255,255,255,.06)'} 60%,${on?'#062a3a':'rgba(0,0,0,.3)'} 100%);box-shadow:inset 0 1px 2px rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.4)`,\n        statusLabel: on?'DEPLOYED':'IDLE',\n        statusStyle: `font:700 8px 'Chakra Petch';margin-top:5px;padding:2px 7px;border-radius:5px;background:${on?'rgba(53,208,255,.2)':'rgba(255,255,255,.06)'};color:${on?'#35d0ff':'rgba(255,255,255,.4)'}`,\n        menuOpen,\n        menuStyle: `position:absolute;left:${pos.x}px;top:${pos.y+52}px;transform:translateX(-50%);z-index:5;display:${menuOpen?'flex':'none'};flex-direction:column;gap:6px;background:#12151f;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px;box-shadow:0 10px 24px -6px rgba(0,0,0,.6);min-width:150px`,\n        selectLabel: on ? 'ยกเลิกการเลือก' : 'ทำโจทย์เพื่อเลือก',\n        toggleSelect: on ? (() => this.toggleLayer(l.id)) : (() => this.openLayerDetail(l.id)),\n        openDetail: () => this.openLayerDetail(l.id)\n      };\n    });\n    const detailLayer = s.detailLayerId ? this.defenseLayers.find(l=>l.id===s.detailLayerId) : null;\n    const hasDetailLayer = !!detailLayer;\n    let detailLayerView = {label:'', icon:'', detail:'', deployed:false, question:'', optionsView:[], setupOptionsView:[], taskDone:false, setupTaskDone:false, showConfirm:false};\n    if (detailLayer) {\n      const taskDone = s.completedTasks.includes(detailLayer.id);\n      const setupTaskDone = s.completedSetupTasks.includes(detailLayer.id);\n      const deployed = s.deployedLayers.includes(detailLayer.id);\n      const optionsView = (detailLayer.options||[]).map(o => {\n        const showGreen = taskDone && o.correct;\n        return {\n          ...o, onClick: () => this.answerTask(detailLayer.id, o.id, o.correct),\n          style: `width:100%;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font:600 12px 'Noto Sans Thai';border:1px solid ${showGreen?'#2ecc71':(s.taskWrongId===o.id?'#ff4d4d':'rgba(255,255,255,.15)')};background:${showGreen?'rgba(46,204,113,.15)':(s.taskWrongId===o.id?'rgba(255,77,77,.12)':'rgba(255,255,255,.05)')};color:#fff`\n        };\n      });\n      const setupOptionsView = (detailLayer.setupOptions||[]).map(o => {\n        const showGreen = setupTaskDone && o.correct;\n        return {\n          ...o, onClick: () => this.answerSetupTask(detailLayer.id, o.id, o.correct),\n          style: `width:100%;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font:600 12px 'Noto Sans Thai';border:1px solid ${showGreen?'#2ecc71':(s.setupWrongId===o.id?'#ff4d4d':'rgba(255,255,255,.15)')};background:${showGreen?'rgba(46,204,113,.15)':(s.setupWrongId===o.id?'rgba(255,77,77,.12)':'rgba(255,255,255,.05)')};color:#fff`\n        };\n      });\n      const ackedQ1 = s.ackedQ1.includes(detailLayer.id);\n      const showConfirm = (taskDone && setupTaskDone) || deployed;\n      detailLayerView = {\n        ...detailLayer, deployed, taskDone, setupTaskDone, optionsView, setupOptionsView,\n        stepQ1: !ackedQ1 && !deployed, stepQ2: ackedQ1 && !setupTaskDone && !deployed,\n        ackNext: () => this.ackQ1(detailLayer.id),\n        showConfirm,\n        confirmLabel: deployed ? 'ยกเลิกการเลือก' : 'ยืนยันการเลือก',\n        onConfirm: () => this.confirmLayerFromDetail(detailLayer.id)\n      };\n    }\n    const defenseLinesView = this.defenseLayers.map((l, idx) => {\n      const on = s.deployedLayers.includes(l.id);\n      const pos = nodePositions[idx];\n      return {\n        x1: CX, y1: CY, x2: pos.x, y2: pos.y,\n        style: `stroke:${on?'#35d0ff':'rgba(255,255,255,.18)'};stroke-width:${on?2.5:1.4};stroke-dasharray:${on?'0':'4 5'};transition:stroke .3s`\n      };\n    });\n    const hubStyle = `position:absolute;left:${CX}px;top:${CY}px;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:radial-gradient(circle at 35% 30%,#123a52,#04101a 72%);border:2px solid rgba(53,208,255,.55);box-shadow:0 0 ${16+shieldPct/3}px rgba(53,208,255,.5),inset 0 2px 4px rgba(255,255,255,.15);z-index:2`;\n    const attackTimelineView = this.attackSteps.map((st, idx) => {\n      const contained = !st.needs || s.deployedLayers.includes(st.needs);\n      return {\n        ...st,\n        statusLabel: contained? 'CONTAINED' : 'IN PROGRESS',\n        statusStyle: `font:700 9px 'Chakra Petch';padding:4px 9px;border-radius:6px;flex:none;background:${contained?'rgba(46,204,113,.15)':'rgba(255,77,77,.15)'};color:${contained?'#2ecc71':'#ff4d4d'}`,\n        rowStyle: `display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border-radius:10px;background:${contained?'rgba(255,255,255,.03)':'rgba(255,77,77,.06)'};border-left:3px solid ${contained?'rgba(46,204,113,.6)':'rgba(255,77,77,.6)'};border-top:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)`,\n        orbStyle: `width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 11px 'Chakra Petch';color:#fff;background:radial-gradient(circle at 30% 28%,${contained?'#9be8ff':'#ffb3ad'},${contained?'#1a8fbf':'#c0392b'} 60%,${contained?'#062a3a':'#3a0d08'} 100%);box-shadow:inset 0 1px 2px rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.5)`\n      };\n    });\n\n    return {\n      tabs,\n      isHome: s.activeScreen==='home', isMissionSelect: s.activeScreen==='missionSelect',\n      isJoiningRoom: s.activeScreen==='joiningRoom', isLoading: s.activeScreen==='loading',\n      isLiveControl: s.activeScreen==='liveControl', isFinalAttack: s.activeScreen==='question' && isLastRound, isWinning: s.activeScreen==='winning',\n      isQuestionRound, isAnswerReveal, isHowToPlay, currentMission,\n      showEvidenceHint: s.showEvidenceHint, toggleEvidenceHint: () => this.toggleEvidenceHint(),\n      evidenceHintLabel: s.showEvidenceHint ? 'ซ่อนหลักฐาน (Hint)' : 'ดูหลักฐาน (Hint)', evidenceItems: this.evidenceItems,\n      goHowToPlay: () => this.goHowToPlay(), goHome: () => this.goHome(), goPlay: () => this.goPlay(),\n      showAnswer: () => this.showAnswer(),\n      goLeaderboardFromAnswer: () => this.goLeaderboardFromAnswer(),\n      goWinning: () => this.nextMissionOrFinish(), winner, runnersUpView, winningTitle,\n      roundProgressLabel, nextRoundLabel, isLastRound,\n      loadingSeconds: s.loadingSeconds,\n      howToSteps: this.howToSteps,\n      missionsView, catFilters, interFilters, selectedCount, noMissionSelected, missionNextStyle,\n      useRecommended: s.useRecommended, toggleRecommended: () => this.toggleRecommended(),\n      showCustomTime: !s.useRecommended, customTime: s.customTime, onTimeChange: (e) => this.onTimeChange(e),\n      goJoiningRoom: () => this.goJoiningRoom(),\n      difficultyChips, missionSequenceLabel,\n      lobbyCount: this.lobbyPlayers.length, lobbyPlayersView, startLoading: () => this.startLoading(),\n      joinedCount: s.joinedCount, joinedPlayersView: lobbyPlayersView.slice(0, s.joinedCount),\n      leaderboardView, actionBars: this.actionBarsData,\n      revealRecommended: s.revealRecommended, toggleReveal: () => this.toggleReveal(),\n      defenseLayersView, defenseLinesView, hubStyle, shieldPct, attackTimelineView,\n      hasDetailLayer, detailLayerView, closeLayerDetail: () => this.closeLayerDetail(),\n      stopPropagation: (e) => e.stopPropagation()\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
